# Cosmos3-Nano SFT 配置
# 对应 vision_sft_nano.toml

model:
  model_type: cosmos3
  model_name: Cosmos3-Nano
  
  # 序列长度
  seq_length: 45056
  
  # 精度
  precision: bfloat16
  
  # LoRA 配置
  lora:
    enabled: true
    rank: 16
    alpha: 32
    target_modules:
      - q_proj_moe_gen
      - k_proj_moe_gen
      - v_proj_moe_gen
      - o_proj_moe_gen

# 并行配置
parallelism:
  # Cosmos3 不使用 TP/PP
  tensor_model_parallel_size: 1
  pipeline_model_parallel_size: 1
  
  # Context Parallel (可选，用于长序列)
  context_parallel_size: 1
  
  # FSDP
  distributed_parallelism: fsdp

# 训练配置
training:
  phase: sft
  max_iter: 500
  gradient_accumulation_steps: 2
  logging_iter: 1
  validation_iter: 100
  save_iter: 100
  
  # 学习率
  lr: 2.0e-5
  weight_decay: 0.0
  lr_warmup_steps: 50
  
  # 梯度裁剪
  grad_clip_norm: 0.1
  
  # 种子
  seed: 42

# 数据配置
data:
  data_path: ./data/cosmos3
  global_batch_size: 8
  num_workers: 4

# EMA 配置
ema:
  enabled: true
  rate: 0.1

# Checkpoint
checkpoint:
  load_path: null
  output_dir: ./outputs/cosmos3
